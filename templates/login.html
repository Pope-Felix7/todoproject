{% extends 'base.html' %}
{% block title %}Sign In – TodoApp{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-logo"><i class="bi bi-check2-circle"></i></div>
      <h2 class="fw-bold mt-2">Welcome Back</h2>
      <p class="text-muted">Sign in to your account</p>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small fw-semibold">Username</label>
        {{ form.username }}
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">Password</label>
        {{ form.password }}
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>

    <div class="text-center mt-4">
      <span class="text-muted small">Don't have an account?</span>
      <a href="{% url 'register' %}" class="small fw-semibold ms-1 text-decoration-none">Register Free</a>
    </div>
  </div>
</div>
{% endblock %}
